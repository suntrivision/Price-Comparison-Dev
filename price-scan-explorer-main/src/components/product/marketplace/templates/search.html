<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Price Scanner - Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            padding: 30px;
            background: #f8f9fa;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #4facfe;
        }

        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4facfe;
        }

        .stat-label {
            color: #6c757d;
            margin-top: 5px;
        }

        .results-section {
            padding: 30px;
        }

        .marketplace-section {
            margin-bottom: 40px;
        }

        .marketplace-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .marketplace-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .lotus-icon {
            background: #28a745;
        }

        .shopee-icon {
            background: #ff6b35;
        }

        .marketplace-title {
            font-size: 1.5em;
            font-weight: bold;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #4facfe;
        }

        .product-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .product-price {
            font-size: 1.3em;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
        }

        .product-original-price {
            text-decoration: line-through;
            color: #95a5a6;
            font-size: 0.9em;
        }

        .product-similarity {
            background: #4facfe;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            display: inline-block;
            margin-bottom: 10px;
        }

        .product-url {
            color: #3498db;
            text-decoration: none;
            font-size: 0.9em;
            display: block;
            margin-top: 10px;
        }

        .product-url:hover {
            text-decoration: underline;
        }

        .shop-name {
            color: #7f8c8d;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #6c757d;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Product Price Scanner</h1>
            <p>Search and compare prices across Lotus and Shopee marketplaces</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Search for products (e.g., 'Milo', 'Indomie', 'Campbell soup')" />
                <button onclick="searchProducts()" class="search-btn">🔍 Search</button>
            </div>

            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-number" id="lotusCount">-</div>
                    <div class="stat-label">Lotus Products</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="shopeeCount">-</div>
                    <div class="stat-label">Shopee Products</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalCount">-</div>
                    <div class="stat-label">Total Products</div>
                </div>
            </div>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="marketplace-section">
                <div class="marketplace-header">
                    <div class="marketplace-icon lotus-icon">🪷</div>
                    <div class="marketplace-title">Lotus Products</div>
                </div>
                <div class="product-grid" id="lotusResults"></div>
            </div>

            <div class="marketplace-section">
                <div class="marketplace-header">
                    <div class="marketplace-icon shopee-icon">🛍️</div>
                    <div class="marketplace-title">Shopee Products</div>
                </div>
                <div class="product-grid" id="shopeeResults"></div>
            </div>
        </div>
    </div>

    <script>
        // Load stats on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
        });

        // Search when Enter is pressed
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });

        function loadStats() {
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Stats error:', data.error);
                        return;
                    }
                    document.getElementById('lotusCount').textContent = data.lotus_products;
                    document.getElementById('shopeeCount').textContent = data.shopee_products;
                    document.getElementById('totalCount').textContent = data.total_products;
                })
                .catch(error => {
                    console.error('Error loading stats:', error);
                });
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('Please enter a search term');
                return;
            }

            // Show loading
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('lotusResults').innerHTML = '<div class="loading">🔍 Searching Lotus products...</div>';
            document.getElementById('shopeeResults').innerHTML = '<div class="loading">🔍 Searching Shopee products...</div>';

            fetch('/search', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query: query })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('lotusResults').innerHTML = `<div class="error">❌ ${data.error}</div>`;
                    document.getElementById('shopeeResults').innerHTML = '';
                    return;
                }

                displayResults(data);
            })
            .catch(error => {
                console.error('Search error:', error);
                document.getElementById('lotusResults').innerHTML = '<div class="error">❌ Search failed. Please try again.</div>';
                document.getElementById('shopeeResults').innerHTML = '';
            });
        }

        function displayResults(data) {
            // Display Lotus results
            const lotusContainer = document.getElementById('lotusResults');
            if (data.lotus_products.length === 0) {
                lotusContainer.innerHTML = '<div class="no-results">No Lotus products found</div>';
            } else {
                lotusContainer.innerHTML = data.lotus_products.map(product => `
                    <div class="product-card">
                        <div class="product-similarity">${product.similarity}% match</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">RM ${product.price}</div>
                        ${product.discounted_price !== product.price ? `<div class="product-original-price">RM ${product.discounted_price}</div>` : ''}
                        <a href="${product.url}" target="_blank" class="product-url">🔗 View on Lotus</a>
                    </div>
                `).join('');
            }

            // Display Shopee results
            const shopeeContainer = document.getElementById('shopeeResults');
            if (data.shopee_products.length === 0) {
                shopeeContainer.innerHTML = '<div class="no-results">No Shopee products found</div>';
            } else {
                shopeeContainer.innerHTML = data.shopee_products.map(product => `
                    <div class="product-card">
                        <div class="product-similarity">${product.similarity}% match</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">RM ${product.price}</div>
                        ${product.discounted_price !== product.price ? `<div class="product-original-price">RM ${product.discounted_price}</div>` : ''}
                        ${product.shop_name ? `<div class="shop-name">🏪 ${product.shop_name}</div>` : ''}
                        <a href="${product.url}" target="_blank" class="product-url">🔗 View on Shopee</a>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
